<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none';">
  <title>EpicEncore Releases</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --surface: rgba(17, 24, 39, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #00ffcc;
      --accent-dim: rgba(0, 255, 204, 0.12);
      --accent-border: rgba(0, 255, 204, 0.3);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --danger: #f87171;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(ellipse at top, #111827 0%, #030712 60%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 64px 24px 48px;
    }

    /* Header */
    header { text-align: center; margin-bottom: 56px; }

    .ee-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      font-size: 16px;
      color: var(--text-muted);
    }

    /* Project cards */
    .project {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: border-color 0.2s ease;
    }

    .project:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .project-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    .project-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .project-desc {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 20px;
    }

    .state-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .state-Alpha {
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.3);
      color: #fbbf24;
    }

    .state-Beta {
      background: rgba(96, 165, 250, 0.12);
      border: 1px solid rgba(96, 165, 250, 0.3);
      color: #60a5fa;
    }

    .state-Released {
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: #34d399;
    }

    .state-Development {
      background: rgba(156, 163, 175, 0.12);
      border: 1px solid rgba(156, 163, 175, 0.25);
      color: var(--text-muted);
    }

    /* Downloads */
    .downloads {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .download {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .download:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .dl-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .dl-platform {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .dl-meta {
      font-size: 13px;
      color: var(--text-dim);
      overflow-wrap: anywhere;
    }

    .dl-btn {
      display: inline-flex;
      align-items: center;
      padding: 10px 22px;
      background: var(--accent);
      color: #030712;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      text-decoration: none;
      transition: transform 0.12s ease, background 0.12s ease;
      flex-shrink: 0;
    }

    .dl-btn:hover {
      background: #33ffd6;
      transform: translateY(-1px);
    }

    .dl-btn:active {
      transform: translateY(0);
    }

    /* Security notice */
    .security-note {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 20px;
      padding: 14px 16px;
      background: rgba(0, 255, 204, 0.04);
      border: 1px solid rgba(0, 255, 204, 0.12);
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .shield-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 1px;
      color: var(--accent);
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    footer p {
      font-size: 13px;
      color: var(--text-dim);
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    footer a:hover {
      color: var(--text);
    }

    /* Error state */
    .error {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-muted);
    }

    .error p {
      margin-bottom: 12px;
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-dim);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 520px) {
      .container { padding: 40px 16px 32px; }
      h1 { font-size: 32px; }
      .project { padding: 24px 20px; }
      .download {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .dl-btn { text-align: center; justify-content: center; }
      .project-head { flex-direction: column; gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="ee-badge">EpicEncore</div>
      <h1>Releases</h1>
      <p>Latest builds for EpicEncore projects.</p>
    </header>

    <div id="content" class="loading">
      <div class="spinner"></div>
      <p>Loading releases…</p>
    </div>

    <footer>
      <p>An <a href="https://github.com/zacaracaz" rel="noopener" target="_blank">EpicEncore</a> project &middot; Downloads are hosted on GitHub Releases</p>
    </footer>
  </div>

  <script src="catalogue.js" defer></script>
</body>
</html>
